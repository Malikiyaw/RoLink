name: Generate RoLink audit artifacts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !startsWith(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run generate:code-fields
      - run: npm run generate:fixtures
      - run: npm run audit:tools
      - name: Commit generated artifacts
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/code-fields.json docs/tool-audit.md rolink-extension/core/__fixtures__/tool-calls
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[generated] refresh parser fields, fixtures, and tool audit"
          git push origin main
