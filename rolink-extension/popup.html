<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RoLink</title>
  <style>
    :root{--bg:#16161a;--panel:#1d1d22;--border:#2a2a30;--text:#e8e8ec;--muted:#8b8b94;--green:#34d399;--yellow:#fbbf24;--red:#f87171;--accent:#2f81f7;}
    *{box-sizing:border-box}
    body{width:248px;margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{padding:14px}
    h1{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
    .ver{font-size:9.5px;font-weight:500;letter-spacing:.2px;color:rgba(255,255,255,.55);background:none;border:none;padding:0}
    .dot{width:9px;height:9px;border-radius:50%;background:#6b7280;transition:all .3s}
    .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
    .dot.warn{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
    .dot.err{background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .row{font-size:12px;opacity:.85;margin:6px 0}
    .row.dim{color:var(--muted);font-size:11px}
    .row code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:11px}
    .sep{height:1px;background:var(--border);margin:10px 0}
    button{width:100%;margin-top:8px;padding:8px;border:0;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;background:rgba(255,255,255,.08);color:var(--text);transition:background .15s}
    button:hover{background:rgba(255,255,255,.14)}
    button.primary{background:linear-gradient(135deg,#2f81f7,#1f6feb);color:#fff;font-weight:600;margin-top:10px}
    button.primary:hover{background:linear-gradient(135deg,#1f6feb,#1158c7)}
    button.primary:disabled{opacity:.5;cursor:not-allowed}
    button.warn{background:rgba(248,113,113,.16);color:#fca5a5;border:1px solid rgba(248,113,113,.4)!important}
    .tools-list{max-height:110px;overflow-y:auto;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.5;margin-top:4px}
    .tools-list .t{display:inline-block;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin:1px 2px;color:#7dd3fc}
    .tools-list::-webkit-scrollbar{width:5px}
    .tools-list::-webkit-scrollbar-thumb{background:#3a3a44;border-radius:3px}
    .log{max-height:80px;overflow-y:auto;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.5;margin-top:4px;color:var(--muted)}
    .log .e{color:var(--text);margin-bottom:1px}
    .log .e.ok{color:var(--green)}
    .log .e.err{color:var(--red)}
    .log .e .t{color:#7dd3fc;margin-right:4px}
    .log::-webkit-scrollbar{width:5px}
    .log::-webkit-scrollbar-thumb{background:#3a3a44;border-radius:3px}
    .toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;box-shadow:0 4px 12px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
    .toast.show{opacity:1}
    .toast.err{border-color:#f87171;color:#fca5a5}
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span id="dot" class="dot"></span> RoLink <span id="ver" class="ver"></span></h1>
    <div class="row" id="state">Bridge: …</div>
    <div class="row dim" id="tools">…</div>
    <div class="tools-list" id="toolsList" style="display:none">Loading...</div>
    <div class="log" id="log" style="display:none"><div class="e">No activity yet.</div></div>
    <button class="primary" id="startAgent">▶ Start agent</button>
    <button id="reconnect">↻ Reconnect bridge</button>
    <button id="restart">⟲ Restart Roblox server</button>
    <button id="settings">⚙ Settings</button>
    <div class="row dim" style="margin-top:10px">
      Run <code>start.bat</code>, open <b>Roblox Studio</b> + a supported AI, then Start agent.
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
