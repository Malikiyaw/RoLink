<!doctype html><meta charset="utf-8"><title>RoLink</title>
<style>
:root{
  --bg:#0e1116;--panel:#161b22;--border:#262d36;--text:#e6edf3;--muted:#8b949e;
  --green:#3fb950;--yellow:#d29922;--red:#f85149;--grey:#6e7681;--accent:#2f81f7;
}
*{box-sizing:border-box}
body{width:320px;font:13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0;margin:0;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#1a2030,#161b22)}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2f81f7,#3fb950);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;box-shadow:0 2px 8px rgba(47,129,247,.4)}
.title{font-weight:600;font-size:14px}.ver{font-size:10px;color:var(--muted);margin-top:1px}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey);box-shadow:0 0 6px transparent;transition:all .3s}
.dot.green{background:var(--green);box-shadow:0 0 8px rgba(63,185,80,.6)}
.dot.yellow{background:var(--yellow);box-shadow:0 0 8px rgba(210,153,34,.6)}
.dot.red{background:var(--red);box-shadow:0 0 8px rgba(248,81,73,.6);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
main{padding:12px 14px}
.row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12px;gap:8px}
.row .k{color:var(--muted)}
.row .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.section{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.section h3{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.section h3 .pill{background:#1f6feb22;color:#58a6ff;border:1px solid #1f6feb44;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{
  padding:9px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);cursor:pointer;font-size:12px;
  font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s ease;
}
button:hover{background:#1f2630;border-color:#3a424d;transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.primary{background:linear-gradient(135deg,#2f81f7,#1f6feb);border-color:#1f6feb;color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(47,129,247,.3)}
button.primary:hover{background:linear-gradient(135deg,#1f6feb,#1158c7);border-color:#1158c7}
button.primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
button.warn{background:#21262d;border-color:#da3633;color:var(--red)}
button.warn:hover{background:#2d1416}
button.full{grid-column:span 2}
.tools-list{max-height:140px;overflow-y:auto;background:#0a0d12;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.5}
.tools-list .t{display:inline-block;background:#1f2630;border:1px solid #30363d;border-radius:4px;padding:1px 5px;margin:1px 2px;color:#58a6ff}
.tools-list::-webkit-scrollbar{width:6px}
.tools-list::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
.log{max-height:100px;overflow-y:auto;background:#0a0d12;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.5;color:var(--muted)}
.log .e{color:var(--text);margin-bottom:1px}
.log .e.ok{color:var(--green)}
.log .e.err{color:var(--red)}
.log .e .t{color:#58a6ff;margin-right:4px}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
footer{padding:8px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);text-align:center;background:#0a0d12}
.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;box-shadow:0 4px 12px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
.toast.err{border-color:#da3633;color:var(--red)}
</style>
<header>
  <div class="logo">R</div>
  <div>
    <div class="title">RoLink</div>
    <div class="ver" id="ver">v1.1.4</div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statustxt">offline</span></div>
</header>
<main>
  <div class="section">
    <h3>Status</h3>
    <div class="row"><span class="k">Bridge</span><span class="v" id="bridgeUrl">ws://127.0.0.1:17613</span></div>
    <div class="row"><span class="k">MCP HTTP</span><span class="v" id="mcpUrl">http://127.0.0.1:3001</span></div>
    <div class="row"><span class="k">Uptime</span><span class="v" id="uptime">-</span></div>
    <div class="row"><span class="k">MCP servers</span><span class="v" id="servers">-</span></div>
  </div>
  <div class="section">
    <h3>Tools <span class="pill" id="toolCount">-</span></h3>
    <div class="tools-list" id="toolsList">Loading...</div>
  </div>
  <div class="section">
    <h3>Activity</h3>
    <div class="log" id="log"><div class="e">No activity yet.</div></div>
  </div>
  <div class="actions">
    <button id="startAgent" class="primary full" title="Inject system prompt + starter into the active AI tab">▶ Start agent</button>
    <button id="reconnect" title="Reconnect to bridge">↻ Reconnect</button>
    <button id="restart" title="Restart the bridge" class="warn">⟲ Restart</button>
    <button id="openStudio" title="Open Roblox Studio dashboard">🎮 Studio</button>
    <button id="openOptions" title="Open settings">⚙ Settings</button>
  </div>
</main>
<footer>Keep start.bat running in the background</footer>
<div class="toast" id="toast"></div>
<script src="popup.js"></script>
