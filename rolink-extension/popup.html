<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RoLink</title>
  <style>
    :root{
      --bg:#0e1116;--panel:#161b22;--border:#262d36;--text:#e6edf3;--muted:#8b949e;
      --green:#3fb950;--yellow:#d29922;--red:#f85149;--accent:#2f81f7;
    }
    *{box-sizing:border-box}
    body{width:280px;margin:0;font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{padding:14px}
    h1{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
    .ver{font-size:9.5px;font-weight:500;letter-spacing:.2px;color:rgba(255,255,255,.5);background:none;border:none;padding:0;margin-left:auto}
    .dot{width:9px;height:9px;border-radius:50%;background:#6b7280;transition:all .3s}
    .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
    .dot.warn{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
    .dot.err{background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .row{font-size:12px;opacity:.85;margin:6px 0}
    .row.dim{color:var(--muted);font-size:11px}
    .row code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:11px}
    .start-btn{
      width:100%;
      display:flex;align-items:center;justify-content:center;gap:8px;
      padding:11px 14px;margin:10px 0 4px;
      background:linear-gradient(135deg,#2f81f7,#1f6feb);
      border:1px solid #1f6feb;border-radius:8px;color:#fff;cursor:pointer;
      font-size:13px;font-weight:600;letter-spacing:.2px;
      box-shadow:0 4px 12px rgba(47,129,247,.3);
      transition:transform .12s,box-shadow .12s,opacity .2s;
    }
    .start-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(47,129,247,.4)}
    .start-btn:active{transform:translateY(0)}
    .start-btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
    .start-btn .ic{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
    .ghost{
      width:100%;padding:8px;margin-top:6px;
      background:rgba(255,255,255,.06);color:var(--text);
      border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px;
      transition:background .12s;
    }
    .ghost:hover{background:rgba(255,255,255,.12)}
    .ghost.warn{background:rgba(248,81,73,.12);color:#fca5a5;border-color:rgba(248,81,73,.4)}
    .tools-box{
      max-height:120px;overflow-y:auto;
      background:rgba(0,0,0,.30);border:1px solid var(--border);border-radius:6px;
      padding:6px 8px;margin-top:6px;
      font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.55;
    }
    .tools-box .t{display:inline-block;background:rgba(47,129,247,.12);border:1px solid rgba(47,129,247,.3);color:#79c0ff;border-radius:4px;padding:1px 5px;margin:1px 2px}
    .tools-box::-webkit-scrollbar{width:5px}
    .tools-box::-webkit-scrollbar-thumb{background:#3a3a44;border-radius:3px}
    .toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;box-shadow:0 4px 12px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
    .toast.show{opacity:1}
    .toast.err{border-color:#f87171;color:#fca5a5}
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span id="dot" class="dot"></span> RoLink <span id="ver" class="ver"></span></h1>
    <div class="row" id="state">Bridge: …</div>
    <div class="row dim" id="tools">…</div>
    <div class="tools-box" id="toolsList" style="display:none">Loading…</div>
    <button class="start-btn" id="startAgent"><span class="ic">R</span> Start RoLink agent</button>
    <button class="ghost" id="reconnect">↻ Reconnect bridge</button>
    <button class="ghost warn" id="restart">⟲ Restart Roblox server</button>
    <div class="row dim" style="margin-top:10px">
      Run <code>start.bat</code>, open <b>Roblox Studio</b> + a supported AI, then click Start.
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
