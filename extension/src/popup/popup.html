<!doctype html>
<html>
<head><meta charset="utf-8"><title>RoLink Phase B</title><style>
body{font-family:system-ui;width:360px;padding:10px;margin:0;font-size:13px}
h1{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:4px;margin:6px 0}
.tab{padding:4px 8px;border:1px solid #ccc;border-radius:6px;cursor:pointer;background:#f5f5f5;font-size:11px}
.tab.active{background:#333;color:#fff;border-color:#333}
.section{display:none}
.section.active{display:block}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
button{padding:5px 8px;border-radius:6px;border:1px solid #ccc;cursor:pointer;background:#fff;font-size:12px}
button:hover{background:#eee}
.toggle{width:38px;height:20px;background:#ddd;border-radius:10px;position:relative;cursor:pointer}
.toggle.on{background:#4caf50}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on::after{left:20px}
.status{font-size:11px;color:#555}
pre{font-size:10px;max-height:100px;overflow:auto;background:#f6f6f6;padding:6px;white-space:pre-wrap;word-break:break-all}
input,select,textarea{padding:4px 6px;border:1px solid #ccc;border-radius:6px;font-size:12px}
textarea{width:100%;box-sizing:border-box}
.badge{font-size:10px;background:#e3f2fd;padding:2px 6px;border-radius:10px}
</style></head>
<body>
<h1>RoLink <span class="badge">Phase B</span></h1>
<div class="row"><span>Bridge</span> <span id="bridgeStatus" class="status">checking…</span> <span>MCP</span> <span id="mcpStatus" class="status">checking…</span> <span id="perfBadge" class="badge">perf —</span></div>

<div class="tabs">
  <div class="tab active" data-tab="controls">Controls</div>
  <div class="tab" data-tab="logs">Team Log</div>
  <div class="tab" data-tab="templates">Templates</div>
  <div class="tab" data-tab="review">Review</div>
</div>

<div id="controls" class="section active">
  <div class="row"><label>Build / Learn</label><div id="learnToggle" class="toggle"></div> <button id="snapshotBtn">Snapshot</button></div>
  <div class="row"><label>Difficulty</label> <select id="difficulty"><option value="adaptive">Adaptive</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select> <button id="applyDiff">Apply</button></div>
  <div class="row"><input id="soundPrompt" placeholder="sound prompt" style="flex:1"><button id="genSound">Gen SFX</button></div>
  <div class="row"><button id="enqueueTest">Test Part</button> <button id="planBtn">Plan: obby</button> <button id="undoBtn">Undo</button> <button id="rollbackBtn">Rollback</button></div>
  <div class="row"><input id="codePatch" placeholder="Luau to review/validate e.g., print('hi')" style="flex:1"> <button id="validateBtn">Validate</button></div>
</div>

<div id="logs" class="section">
  <div class="row"><button id="refreshLogs">Refresh</button> <button id="clearLogs">Queue Status</button> <span id="queueDepth" class="badge"></span></div>
  <pre id="log"></pre>
</div>

<div id="templates" class="section">
  <div class="row"><select id="templateSel"></select> <button id="useTemplate">Use</button> <button id="listTemplates">Refresh</button></div>
  <pre id="templatePreview"></pre>
</div>

<div id="review" class="section">
  <textarea id="reviewCode" rows="4" placeholder="Paste Luau to review..."></textarea>
  <div class="row"><button id="reviewBtn">Review</button> <button id="genTestBtn">Gen Tests</button> <button id="styleBtn">Style profile</button></div>
  <pre id="reviewOut"></pre>
</div>

<script src="popup.js"></script>
</body>
</html>
